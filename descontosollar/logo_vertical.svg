<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <defs>
    <!-- Importar a fonte Inter -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;display=swap');
      .text-desconto {
        font-family: 'Inter', Arial, Helvetica, sans-serif;
        font-weight: 700;
        font-size: 52px;
        fill: #258887;
        letter-spacing: -1.5px;
      }
      .text-sollar {
        font-family: 'Inter', Arial, Helvetica, sans-serif;
        font-weight: 700;
        font-size: 62px;
        fill: #D85C03;
        letter-spacing: -1.5px;
      }
    </style>
  </defs>
  
  <!-- Símbolo no topo (Alinhado e Simétrico) -->
  <g transform="translate(200, 140)">
    <!-- Diagonal principal (Teal) -->
    <line x1="-80" y1="80" x2="80" y2="-80" stroke="#258887" stroke-width="24" stroke-linecap="round" />
    
    <!-- Raios solares (Laranja) -->
    <line x1="-72" y1="-72" x2="-36" y2="-36" stroke="#D85C03" stroke-width="24" stroke-linecap="round" />
    <line x1="36" y1="36" x2="72" y2="72" stroke="#D85C03" stroke-width="24" stroke-linecap="round" />
    <line x1="-102" y1="0" x2="-66" y2="0" stroke="#D85C03" stroke-width="24" stroke-linecap="round" />
    <line x1="66" y1="0" x2="102" y2="0" stroke="#D85C03" stroke-width="24" stroke-linecap="round" />
    
    <!-- Círculos (Teal) -->
    <circle cx="0" cy="-94" r="20" fill="#258887" />
    <circle cx="0" cy="94" r="20" fill="#258887" />
  </g>
  
  <!-- Textos centralizados abaixo -->
  <text x="200" y="300" class="text-desconto" text-anchor="middle">Desconto</text>
  <text x="200" y="360" class="text-sollar" text-anchor="middle">Sollar</text>
</svg>
