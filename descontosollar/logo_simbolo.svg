<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="512" height="512" fill="none">
  <!-- Símbolo oficial (Alinhado e Simétrico) -->
  <g transform="translate(150, 150)">
    <!-- Diagonal principal (Teal) -->
    <line x1="-80" y1="80" x2="80" y2="-80" stroke="#258887" stroke-width="24" stroke-linecap="round" />
    
    <!-- Raios solares (Laranja) -->
    <line x1="-72" y1="-72" x2="-36" y2="-36" stroke="#D85C03" stroke-width="24" stroke-linecap="round" />
    <line x1="36" y1="36" x2="72" y2="72" stroke="#D85C03" stroke-width="24" stroke-linecap="round" />
    <line x1="-102" y1="0" x2="-66" y2="0" stroke="#D85C03" stroke-width="24" stroke-linecap="round" />
    <line x1="66" y1="0" x2="102" y2="0" stroke="#D85C03" stroke-width="24" stroke-linecap="round" />
    
    <!-- Círculos (Teal) -->
    <circle cx="0" cy="-94" r="20" fill="#258887" />
    <circle cx="0" cy="94" r="20" fill="#258887" />
  </g>
</svg>
